[project]
name = "agent-orchestrator-python"
version = "0.1.0"
description = "Python track for the AI Genius GitHub Copilot SDK labs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "github-copilot-sdk==1.0.9",
    "mcp>=1.12,<2",
    "pydantic>=2.11,<3",
    "sqlmodel>=0.0.24,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[[tool.uv.index]]
name = "microsoft-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
