<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI Genius S5E2 — GitHub Copilot SDK 零售分析助手简体与繁体中文文档">
    <title>AI Genius S5E2 — 中文文档</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f7fb;
        color: #172033;
      }
      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 3rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 12%);
        text-align: center;
      }
      h1 { margin-top: 0; }
      p { color: #596579; }
      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }
      a {
        padding: 1rem;
        border-radius: .6rem;
        background: #4051b5;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover, a:focus { background: #303f9f; }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f8fafc; }
        main { background: #1f2937; }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Genius S5E2 — 中文文档</h1>
      <p>请选择语言 / 請選擇語言</p>
      <nav aria-label="语言选择">
        <a href="./zh-cn/">简体中文</a>
        <a href="./zh-tw/" lang="zh-TW">繁體中文</a>
      </nav>
    </main>
  </body>
</html>
